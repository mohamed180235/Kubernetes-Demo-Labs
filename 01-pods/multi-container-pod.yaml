apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.27

    - name: sidecar
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            echo "sidecar is running"
            sleep 10
          done
